name = "studio-cartelli-labs"
main = "./src/worker.ts"
compatibility_date = "2026-04-08"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
LASTFM_USERNAME = "patcartelli"

[[kv_namespaces]]
binding = "LASTFM_CHART_CACHE"
id = "51011fe993fc4e979dd9d05c10b26643"

# Secrets (not stored here) — provision after the KV namespace exists:
#   wrangler secret put LASTFM_API_KEY
#   wrangler secret put TADB_API_KEY

# Optional preview environment, mirroring the main repo's pattern
# (wrangler deploy --env preview creates a separate studio-cartelli-labs-preview
# Worker). Uncomment and create a second dedicated KV namespace if wanted —
# do not point this at the production namespace above (same reasoning as
# the main repo's STC-23 preview-isolation fix).
#
# [env.preview]
#
# [env.preview.observability]
# enabled = true
#
# [env.preview.vars]
# LASTFM_USERNAME = "patcartelli"
#
# [[env.preview.kv_namespaces]]
# binding = "LASTFM_CHART_CACHE"
# id = "REPLACE_WITH_NEW_PREVIEW_KV_NAMESPACE_ID"
