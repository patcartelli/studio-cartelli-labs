name = "studio-cartelli-labs"
main = "./src/worker.ts"
compatibility_date = "2026-04-08"
compatibility_flags = ["nodejs_compat"]

# Keep the *.workers.dev URL live alongside the routes below — useful for
# isolating "is this a routing problem or a Worker problem" during the
# cutover, and costs nothing to leave on. Must stay a top-level key, NOT
# placed after a [[routes]] block — TOML would silently fold it into that
# table as an (invalid, silently-dropped) route field. Learned the hard way
# during the STC-205 Phase 2 cutover: it swallowed the exact-match /lab
# route entirely with no error until deploying with --config directly.
workers_dev = true

# STC-208 Phase 2 cutover routes — re-attached 2026-08-07 after the
# asset-path root cause (see astro.config.mjs) was fixed in c8b3e02 and
# verified clean on *.workers.dev. Two patterns required — "/lab/*" does
# not match the bare "/lab" path (confirmed live during the first attempt).
[[routes]]
pattern = "studiocartelli.com/lab"
zone_name = "studiocartelli.com"

[[routes]]
pattern = "studiocartelli.com/lab/*"
zone_name = "studiocartelli.com"

[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
LASTFM_USERNAME = "patcartelli"

[[kv_namespaces]]
binding = "LASTFM_CHART_CACHE"
id = "51011fe993fc4e979dd9d05c10b26643"

# Secrets (not stored here) — provision after the KV namespace exists:
#   wrangler secret put LASTFM_API_KEY
#   wrangler secret put TADB_API_KEY

# Optional preview environment, mirroring the main repo's pattern
# (wrangler deploy --env preview creates a separate studio-cartelli-labs-preview
# Worker). Uncomment and create a second dedicated KV namespace if wanted —
# do not point this at the production namespace above (same reasoning as
# the main repo's STC-23 preview-isolation fix).
#
# [env.preview]
#
# [env.preview.observability]
# enabled = true
#
# [env.preview.vars]
# LASTFM_USERNAME = "patcartelli"
#
# [[env.preview.kv_namespaces]]
# binding = "LASTFM_CHART_CACHE"
# id = "REPLACE_WITH_NEW_PREVIEW_KV_NAMESPACE_ID"
