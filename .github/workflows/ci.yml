name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - run: npm ci
      - run: npx astro check

  playwright:
    name: Playwright
    # Runs natively on the host, not in the Playwright container — this
    # app's prod build/preview use the Cloudflare Worker runtime
    # (@astrojs/cloudflare starts a local miniflare/workerd proxy for
    # prerender bindings), which doesn't play well with the container.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - run: npm ci
      - name: Fetch chromium from Playwright image (no CDN download)
        run: |
          docker create --name pw mcr.microsoft.com/playwright:v1.59.1-noble
          docker cp pw:/ms-playwright "$PLAYWRIGHT_BROWSERS_PATH"
          docker rm pw
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright
      - name: Install Playwright OS deps (chromium libs only)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 \
            libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 \
            libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 \
            libfontconfig1 libfreetype6 fonts-liberation
      # Makes /lab/chart's tests actually run here. CI has no LASTFM_API_KEY, so
      # the page's SSR fetch throws, it renders empty, and every data-gated test
      # in tests/lab-chart.spec.ts skips — while the job stays green. A green
      # check means nothing for that page. LASTFM_FIXTURE swaps in a
      # deterministic captured payload (src/lib/lastfm-fixture.ts) with no
      # credentials and no network.
      #
      # Written to .dev.vars, not a step-level `env:`: playwright.config.ts
      # runs `npm run build:preview && npm run preview` under CI, which starts
      # a workerd/miniflare runtime — that runtime's env (what chart.astro
      # reads via cloudflare:workers) is populated from .dev.vars, not from
      # the GitHub Actions step environment. A step-level env var would set
      # this only on the Playwright process and the fixture would silently
      # never activate.
      #
      # Uses `>` (truncate), not `>>`: unlike studio-cartelli, this workflow
      # has no preceding step that writes .dev.vars, and .dev.vars is
      # gitignored so the CI checkout never has one to begin with. If a future
      # step is added that writes .dev.vars BEFORE this one, this must become
      # `>>` or it will silently destroy that step's values.
      #
      # Deliberately unconditional and deliberately NOT gated on a secret:
      # - a real LASTFM_API_KEY would tie CI to Last.fm's uptime and rate
      #   limits and still leave fork PRs uncovered;
      # - referencing a secret in a step `if:` has silently killed workflows
      #   in the sibling studio-cartelli repo before, so this avoids that
      #   shape entirely.
      - name: Enable deterministic Last.fm fixture for chart tests
        run: printf 'LASTFM_FIXTURE="1"\n' > .dev.vars
      - name: Run Playwright tests (all viewports)
        run: npx playwright test
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
